<text x="60" y="731" font-size="21" font-weight="700" fill="#2563eb" text-anchor="start">Back to awareness: 12 new referral visitors</text>
<text x="60" y="760" font-size="17" font-weight="400" fill="#17233a" text-anchor="start">These recipients start a separate journey. Five activate and two pay within their own 14-day windows.</text>
<text x="36" y="820" font-size="16" font-weight="400" fill="#526176" text-anchor="start">Band width represents people. The dotted connector introduces new people; it is not a proportional band.</text>
