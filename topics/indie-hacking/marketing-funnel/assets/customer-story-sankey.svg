<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title description">
<title id="title">The six funnel stages in the meal-planning app story</title>
<desc id="description">Awareness: 600 people find weekday dinner ideas and visit the product page. Interest: 180 open the sample menu. Consideration: 60 start a trial, and 36 reach activation by saving a weekly menu with its grocery list. Conversion: 18 activated trial users pay. Retention: 12 buyers save another weekly menu with its grocery list during days 30 through 44 after payment. Referral: 4 returning buyers bring a new visitor by day 60 after payment. Gray branches show 420 without opening the sample menu, 120 without a trial, 42 without payment, 6 without repeat use, and 8 returning buyers without a qualified referral in the relevant windows. A dotted connector, not a proportional flow, leads to a separate group of 12 new referral visitors; 5 activate and 2 pay, with their overlap unspecified. All counts are illustrative.</desc>
<defs><marker id="new-people-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#2563eb"/></marker></defs>
<rect x="1" y="1" width="1198" height="848" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="36" y="46" font-size="28" font-weight="700" fill="#17233a">Where each stage appears in the meal-planning app story</text>
<text x="36" y="77" font-size="17" fill="#526176">The opening table mapped to the worked example · original 600 visitors · illustrative counts</text>
