<path data-source="interest" data-target="no-trial" data-value="120" d="M 304 255.0 C 388.48 255.0, 395.52 440, 480 440 L 480 500.0 C 395.52 500.0, 388.48 315.0, 304 315.0 Z" fill="#94a3b8" fill-opacity="0.30"/>
<path data-source="consideration" data-target="conversion" data-value="18" d="M 504 225.0 C 588.48 225.0, 595.52 225, 680 225 L 680 234.0 C 595.52 234.0, 588.48 234.0, 504 234.0 Z" fill="#7c3aed" fill-opacity="0.30"/>
<path data-source="consideration" data-target="no-payment" data-value="42" d="M 504 234.0 C 588.48 234.0, 595.52 440, 680 440 L 680 461.0 C 595.52 461.0, 588.48 255.0, 504 255.0 Z" fill="#94a3b8" fill-opacity="0.30"/>
<path data-source="conversion" data-target="retention" data-value="12" d="M 704 225.0 C 788.48 225.0, 795.52 225, 880 225 L 880 231.0 C 795.52 231.0, 788.48 231.0, 704 231.0 Z" fill="#0f766e" fill-opacity="0.30"/>
<path data-source="conversion" data-target="no-repeat" data-value="6" d="M 704 231.0 C 788.48 231.0, 795.52 440, 880 440 L 880 443.0 C 795.52 443.0, 788.48 234.0, 704 234.0 Z" fill="#94a3b8" fill-opacity="0.30"/>
<path data-source="retention" data-target="referral" data-value="4" d="M 904 225.0 C 988.48 225.0, 995.52 225, 1080 225 L 1080 227.0 C 995.52 227.0, 988.48 227.0, 904 227.0 Z" fill="#c2410c" fill-opacity="0.30"/>
<path data-source="retention" data-target="no-referral" data-value="8" d="M 904 227.0 C 988.48 227.0, 995.52 440, 1080 440 L 1080 444.0 C 995.52 444.0, 988.48 231.0, 904 231.0 Z" fill="#94a3b8" fill-opacity="0.30"/>
